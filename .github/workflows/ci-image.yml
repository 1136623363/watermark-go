name: CI Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Checkout frontend contract source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: 1136623363/watermark
          ref: 5d72c4925017676b6183b907dfe11ec60a4885bf
          path: .frontend-contract
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.26.5"
          check-latest: false

      - name: Run tests
        env:
          FRONTEND_REPO: .frontend-contract
        run: |
          go test ./...
          go test -race ./internal/httpapi ./internal/auth ./tests/contracts
          go test ./tests/contracts -run TestMediaParserIntegrationContract -count=1
          go vet ./...
          python3 -m py_compile tests/e2e/conftest.py tests/e2e/test_*.py
          scripts/verify-frontend-provenance.sh
          for f in .frontend-contract/test/test_miniprogram_*.js; do node "$f"; done
          scripts/verify-gitleaks.sh

      - name: Incremental secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_VERSION: "8.30.1"

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/1136623363/watermark-go:sha-${{ github.sha }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/1136623363/watermark-go

      - name: Runtime tool smoke
        env:
          IMAGE_REF: ghcr.io/1136623363/watermark-go@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/yt-dlp "$IMAGE_REF" --version
          docker run --rm --entrypoint /usr/local/bin/ffmpeg "$IMAGE_REF" -version
          docker run --rm --entrypoint /usr/local/bin/python3 "$IMAGE_REF" -c "import pathlib; compile(pathlib.Path('/app/bridges/universal/python/bridge.py').read_text(encoding='utf-8'), '/app/bridges/universal/python/bridge.py', 'exec')"
