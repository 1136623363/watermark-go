<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .title }}</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #17212b;
      --muted: #64707d;
      --line: #dfe5ea;
      --brand: #146c63;
      --danger: #b42318;
      --warn: #8a4b05;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    .login {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 38px rgba(20, 35, 48, .12);
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }
    .sub {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }
    label {
      color: #314250;
      font-size: 13px;
      font-weight: 650;
    }
    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cfd8df;
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      font: inherit;
    }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(20,108,99,.12);
    }
    button {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    .msg {
      display: none;
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .msg.show {
      display: block;
    }
    .msg.err {
      background: #fee4df;
      color: var(--danger);
    }
    .warn {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff3d6;
      color: var(--warn);
      font-size: 13px;
      line-height: 1.55;
    }
    @media (max-width: 520px) {
      body {
        display: block;
        min-height: 100svh;
        padding: calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #f4f6f8 0%, #e9f1f2 100%);
      }
      .login {
        width: 100%;
        margin-top: min(18vh, 92px);
        padding: 24px 18px;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(20, 35, 48, .12);
      }
      h1 {
        font-size: 24px;
      }
      .sub {
        margin-bottom: 22px;
        line-height: 1.5;
      }
      input {
        min-height: 46px;
        border-radius: 10px;
        font-size: 16px;
      }
      button {
        min-height: 46px;
        border-radius: 10px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="login">
    <h1>后台登录</h1>
    <p class="sub">进入去水印后台管理系统</p>
    {{ if .useDefault }}
    <p class="warn">当前使用默认后台密码。上线前请设置环境变量 <strong>ADMIN_USERNAME</strong> 和 <strong>ADMIN_PASSWORD</strong>。</p>
    {{ end }}
    <form id="loginForm">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <button id="loginBtn" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    function showError(text) {
      msg.className = 'msg err show';
      msg.textContent = text;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('loginBtn');
      button.disabled = true;
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const body = await res.json();
        if (!res.ok || body.code !== 0) {
          throw new Error(body.msg || '登录失败');
        }
        window.location.href = '/admin';
      } catch (err) {
        showError(err.message || '登录失败');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
