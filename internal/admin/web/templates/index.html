<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .title }}{{ .title }}{{ else }}单机后台{{ end }}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #17212b;
      --muted: #64707d;
      --line: #dfe5ea;
      --brand: #146c63;
      --brand-soft: rgba(20,108,99,.1);
      --danger: #b42318;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .shell {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card, .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(20, 35, 48, .07);
    }
    .card {
      padding: 18px;
    }
    .label {
      color: var(--muted);
      font-size: 13px;
    }
    .value {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 750;
    }
    .panel {
      padding: 22px;
      margin-top: 18px;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .panel p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }
    .settings {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    label {
      color: #314250;
      font-size: 13px;
      font-weight: 650;
    }
    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cfd8df;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(20,108,99,.12);
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    button, .link-button {
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #eef2f6;
      color: #253342;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary {
      background: var(--brand);
      color: #fff;
    }
    .message {
      display: none;
      margin-top: 14px;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
    }
    .message.show { display: block; }
    .message.ok {
      background: #ecfdf5;
      color: var(--ok);
    }
    .message.err {
      background: #fee4df;
      color: var(--danger);
    }
    .empty {
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      color: var(--muted);
      line-height: 1.6;
    }
    @media (max-width: 820px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .grid, .settings {
        grid-template-columns: 1fr;
      }
      .shell {
        width: min(100vw - 24px, 1120px);
        padding-top: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>Watermark 单机后台</h1>
        <p class="subtitle">面向单机运行的状态查看、基线样本概览与少量运行时开关。</p>
      </div>
      <span class="badge">single-node</span>
    </section>

    <section class="grid" aria-label="运行状态">
      <article class="card">
        <div class="label">服务状态</div>
        <div class="value" id="statusValue">--</div>
      </article>
      <article class="card">
        <div class="label">运行时长</div>
        <div class="value" id="uptimeValue">--</div>
      </article>
      <article class="card">
        <div class="label">平台数量</div>
        <div class="value" id="platformValue">--</div>
      </article>
      <article class="card">
        <div class="label">测试链接</div>
        <div class="value" id="linkValue">--</div>
      </article>
    </section>

    <section class="panel">
      <h2>基线样本</h2>
      <p>当前后台只展示本地 fixture 汇总；完整能力测试由后端基线任务按固定并发执行。</p>
      <div class="empty" id="sampleSummary">正在读取样本信息...</div>
    </section>

    <section class="panel">
      <h2>运行时设置</h2>
      <p>这些字段会通过后台写接口记录审计。若页面提示缺少 CSRF，请重新登录后再保存。</p>
      <div class="settings">
        <div class="field">
          <label for="rateLimitEnabled">接口限流</label>
          <select id="rateLimitEnabled">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
          <span class="hint">生产建议开启；本地验证可临时关闭。</span>
        </div>
        <div class="field">
          <label for="httpTimeoutSeconds">HTTP 超时秒数</label>
          <input id="httpTimeoutSeconds" type="number" min="5" max="300" placeholder="30">
          <span class="hint">用于后端出站请求的默认超时。</span>
        </div>
        <div class="field">
          <label for="baselineConcurrency">基线并发</label>
          <input id="baselineConcurrency" type="number" min="1" max="16" placeholder="3">
          <span class="hint">当前计划固定默认为 3。</span>
        </div>
        <div class="field">
          <label for="downloadFallbackEnabled">下载兜底</label>
          <select id="downloadFallbackEnabled">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
          <span class="hint">用于小程序无法直连时的短期中转。</span>
        </div>
        <div class="field">
          <label for="downloadFallbackMode">兜底模式</label>
          <select id="downloadFallbackMode">
            <option value="proxy">proxy</option>
            <option value="off">off</option>
          </select>
        </div>
        <div class="field">
          <label for="downloadFallbackPublicBaseURL">公开基址</label>
          <input id="downloadFallbackPublicBaseURL" placeholder="https://api.example.com">
        </div>
        <div class="field">
          <label for="downloadFallbackCDNBaseURL">CDN 基址</label>
          <input id="downloadFallbackCDNBaseURL" placeholder="https://cdn.example.com">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveBtn">保存设置</button>
        <button id="reloadBtn">刷新状态</button>
        <a class="link-button" href="/admin/login">重新登录</a>
      </div>
      <div class="message" id="message"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const csrfStorageKey = 'watermark_admin_csrf';
    const fields = [
      'rateLimitEnabled',
      'httpTimeoutSeconds',
      'baselineConcurrency',
      'downloadFallbackEnabled',
      'downloadFallbackMode',
      'downloadFallbackPublicBaseURL',
      'downloadFallbackCDNBaseURL'
    ];

    function setMessage(type, text) {
      const box = $('message');
      box.className = `message show ${type}`;
      box.textContent = text;
    }

    function formatDuration(seconds) {
      const value = Number(seconds || 0);
      const hours = Math.floor(value / 3600);
      const minutes = Math.floor((value % 3600) / 60);
      const secs = value % 60;
      if (hours > 0) return `${hours}h ${minutes}m`;
      if (minutes > 0) return `${minutes}m ${secs}s`;
      return `${secs}s`;
    }

    async function readJSON(path, options = {}) {
      const response = await fetch(path, {
        credentials: 'same-origin',
        headers: {
          'Accept': 'application/json',
          ...(options.headers || {})
        },
        ...options
      });
      const payload = await response.json().catch(() => ({}));
      if (response.status === 401) {
        setMessage('err', '登录已失效，请重新登录。');
        throw new Error('unauthorized');
      }
      if (!response.ok || (payload.code && payload.code !== 0)) {
        throw new Error(payload.msg || `request failed: ${response.status}`);
      }
      return payload.data || {};
    }

    function applySummary(data) {
      $('statusValue').textContent = 'ok';
      $('uptimeValue').textContent = formatDuration(data.uptimeSeconds);
      $('platformValue').textContent = data.platformCount ?? '--';
      $('linkValue').textContent = data.testLinkCount ?? '--';
      $('sampleSummary').textContent = `已加载 ${data.testSampleCount || 0} 个样本，其中 ${data.testLinkCount || 0} 个含可执行链接。`;
    }

    async function loadSummary() {
      const data = await readJSON('/admin/api/summary');
      applySummary(data);
      setMessage('ok', '状态已刷新。');
    }

    function collectSettings() {
      const payload = {};
      for (const name of fields) {
        const input = $(name);
        if (!input) continue;
        if (name.endsWith('Enabled')) {
          payload[name] = input.value === 'true';
          continue;
        }
        if (name.endsWith('Seconds') || name === 'baselineConcurrency') {
          payload[name] = Number(input.value || 0);
          continue;
        }
        payload[name] = input.value.trim();
      }
      return payload;
    }

    async function saveSettings() {
      const csrf = sessionStorage.getItem(csrfStorageKey) || localStorage.getItem(csrfStorageKey) || '';
      if (!csrf) {
        setMessage('err', '缺少 CSRF，请重新登录后再保存。');
        return;
      }
      await readJSON('/admin/api/settings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrf
        },
        body: JSON.stringify(collectSettings())
      });
      setMessage('ok', '设置已保存并记录审计。');
    }

    $('reloadBtn').addEventListener('click', () => loadSummary().catch((err) => {
      if (err.message !== 'unauthorized') setMessage('err', err.message);
    }));
    $('saveBtn').addEventListener('click', () => saveSettings().catch((err) => {
      setMessage('err', err.message);
    }));
    loadSummary().catch((err) => {
      if (err.message !== 'unauthorized') setMessage('err', err.message);
    });
  </script>
</body>
</html>
